repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy .
        language: system
        pass_filenames: false
        files: ^(app|tests)/.*\.py$
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        files: ^(app|tests)/.*\.py$
      - id: bandit
        name: bandit
        entry: bandit -r app
        language: system
        pass_filenames: false
        files: ^app/.*\.py$
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
